<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근력 강도 표준표 - 오늘의 근력루틴</title>
<meta name="description" content="체중과 성별을 입력해 벤치프레스, 스쿼트, 데드리프트의 근력 수준(초급~엘리트)을 확인합니다.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8486360926248718" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <h1>근력 강도 표준표</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">체중 대비 3대 운동 기준 중량 (kg)</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label for="bw">체중 (kg)</label>
        <input type="number" id="bw" inputmode="decimal" placeholder="예: 70">
      </div>
      <div>
        <label for="gender">성별</label>
        <select id="gender">
          <option value="male">남성</option>
          <option value="female">여성</option>
        </select>
      </div>
    </div>
    <label for="lift">종목</label>
    <select id="lift">
      <option value="squat">스쿼트</option>
      <option value="bench">벤치프레스</option>
      <option value="deadlift">데드리프트</option>
    </select>
    <button class="btn" onclick="renderStandards()">확인하기</button>
  </div>

  <div class="card" id="tableCard" style="display:none;">
    <table class="std-table" id="stdTable"></table>
  </div>

  <div class="ad-slot">
    <ins class="adsbygoogle"
      style="display:block; width:100%;"
      data-ad-client="ca-pub-8486360926248718"
      data-ad-slot="0000000000"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
  </div>
</div>

<script>
// 체중 배수 기준 (남성/여성, 종목별) - 초급/중급/고급/엘리트
const STANDARDS = {
  male: {
    squat:     [1.0, 1.5, 2.0, 2.5],
    bench:     [0.75, 1.0, 1.5, 1.75],
    deadlift:  [1.25, 1.75, 2.25, 2.75],
  },
  female: {
    squat:     [0.6, 1.0, 1.4, 1.8],
    bench:     [0.4, 0.6, 0.9, 1.1],
    deadlift:  [0.8, 1.2, 1.7, 2.1],
  },
};
const LEVELS = ['초급', '중급', '고급', '엘리트'];

function renderStandards() {
  const bw = parseFloat(document.getElementById('bw').value);
  const gender = document.getElementById('gender').value;
  const lift = document.getElementById('lift').value;
  if (!bw) { alert('체중을 입력해주세요.'); return; }

  const multipliers = STANDARDS[gender][lift];
  let rows = '<tr><th>수준</th><th>기준 중량(kg)</th></tr>';
  multipliers.forEach((m, i) => {
    rows += `<tr><td>${LEVELS[i]}</td><td>${(bw * m).toFixed(1)}</td></tr>`;
  });
  document.getElementById('stdTable').innerHTML = rows;
  document.getElementById('tableCard').style.display = 'block';
}
</script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
<script src="js/common.js"></script>
<script>renderChrome('standard');</script>
</body>
</html>
