<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기초대사량(BMR) 계산기 - 오늘의 근력루틴</title>
<meta name="description" content="체중, 키, 나이, 성별을 입력해 표준 기초대사량(BMR)과 활동대사량(TDEE)을 계산합니다.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8486360926248718" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <h1>기초대사량 계산기</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">Mifflin-St Jeor 공식 기준 표준 BMR</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label for="bw2">체중 (kg)</label>
        <input type="number" id="bw2" inputmode="decimal" placeholder="예: 70">
      </div>
      <div>
        <label for="height">키 (cm)</label>
        <input type="number" id="height" inputmode="decimal" placeholder="예: 175">
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label for="age">나이</label>
        <input type="number" id="age" inputmode="numeric" placeholder="예: 30">
      </div>
      <div>
        <label for="gender2">성별</label>
        <select id="gender2">
          <option value="male">남성</option>
          <option value="female">여성</option>
        </select>
      </div>
    </div>
    <label for="activity">활동 수준</label>
    <select id="activity">
      <option value="1.2">거의 운동 안 함 (좌식 생활)</option>
      <option value="1.375">가벼운 운동 (주 1~3회)</option>
      <option value="1.55" selected>보통 운동 (주 3~5회)</option>
      <option value="1.725">활발한 운동 (주 6~7회)</option>
      <option value="1.9">매우 활발함 (매일 강도 높은 운동)</option>
    </select>

    <button class="btn" onclick="calcBmr()">계산하기</button>

    <div class="result-box" id="bmrResult" style="display:none;">
      <div class="stat-value" id="bmrValue">-</div>
      <div class="stat-label">기초대사량 (BMR, kcal/일)</div>
    </div>
    <div class="result-box" id="tdeeResult" style="display:none; margin-top:10px;">
      <div class="stat-value" id="tdeeValue">-</div>
      <div class="stat-label">활동대사량 (TDEE, kcal/일)</div>
    </div>
  </div>

  <div class="ad-slot">
    <ins class="adsbygoogle"
      style="display:block; width:100%;"
      data-ad-client="ca-pub-8486360926248718"
      data-ad-slot="0000000000"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
  </div>
</div>

<script>
function calcBmr() {
  const w = parseFloat(document.getElementById('bw2').value);
  const h = parseFloat(document.getElementById('height').value);
  const age = parseFloat(document.getElementById('age').value);
  const gender = document.getElementById('gender2').value;
  const activity = parseFloat(document.getElementById('activity').value);

  if (!w || !h || !age) { alert('체중, 키, 나이를 모두 입력해주세요.'); return; }

  // Mifflin-St Jeor
  let bmr = 10 * w + 6.25 * h - 5 * age;
  bmr += (gender === 'male') ? 5 : -161;

  document.getElementById('bmrValue').textContent = bmr.toFixed(0);
  document.getElementById('bmrResult').style.display = 'block';

  const tdee = bmr * activity;
  document.getElementById('tdeeValue').textContent = tdee.toFixed(0);
  document.getElementById('tdeeResult').style.display = 'block';
}
</script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
<script src="js/common.js"></script>
<script>renderChrome('');</script>
</body>
</html>
