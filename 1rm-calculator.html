<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1RM 계산기 - 오늘의 근력루틴</title>
<meta name="description" content="중량과 반복수를 입력해 벤치프레스, 스쿼트, 데드리프트 등의 예상 1RM(최대 1회 중량)을 계산합니다.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8486360926248718" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <h1>1RM 계산기</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">Epley 공식 기반 예상 최대 1회 중량</p>

  <div class="card">
    <label for="weight">사용한 중량 (kg)</label>
    <input type="number" id="weight" inputmode="decimal" placeholder="예: 80">

    <label for="reps">반복 횟수 (RM)</label>
    <input type="number" id="reps" inputmode="numeric" placeholder="예: 5">

    <button class="btn" onclick="calculate()">계산하기</button>

    <div class="result-box" id="result" style="display:none;">
      <div class="stat-value" id="oneRmValue">-</div>
      <div class="stat-label">예상 1RM (kg)</div>
    </div>
  </div>

  <div class="card" id="percentTable" style="display:none;">
    <h3 style="margin-top:0;">퍼센트별 훈련 중량</h3>
    <table class="std-table" id="percentTableBody"></table>
  </div>

  <div class="ad-slot">
    <ins class="adsbygoogle"
      style="display:block; width:100%;"
      data-ad-client="ca-pub-8486360926248718"
      data-ad-slot="0000000000"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
  </div>
</div>

<script>
function calculate() {
  const w = parseFloat(document.getElementById('weight').value);
  const r = parseInt(document.getElementById('reps').value);
  if (!w || !r || r < 1) { alert('중량과 반복 횟수를 정확히 입력해주세요.'); return; }

  // Epley formula
  const oneRm = r === 1 ? w : w * (1 + r / 30);
  document.getElementById('oneRmValue').textContent = oneRm.toFixed(1);
  document.getElementById('result').style.display = 'block';

  const percents = [95, 90, 85, 80, 75, 70, 65, 60];
  let rows = '<tr><th>%1RM</th><th>중량(kg)</th></tr>';
  percents.forEach(p => {
    rows += `<tr><td>${p}%</td><td>${(oneRm * p / 100).toFixed(1)}</td></tr>`;
  });
  document.getElementById('percentTableBody').innerHTML = rows;
  document.getElementById('percentTable').style.display = 'block';
}
</script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
<script src="js/common.js"></script>
<script>renderChrome('onerm');</script>
</body>
</html>
