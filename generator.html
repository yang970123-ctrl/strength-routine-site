<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 루틴 생성기 - 오늘의 근력루틴</title>
<meta name="description" content="부위와 체중만 입력하면 오늘 할 운동과 추천 중량을 랜덤으로 만들어줍니다.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8486360926248718" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">

  <h1 style="margin-top:8px;">오늘 뭐하지? 랜덤 루틴</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">부위와 체중만 넣으면 오늘 할 운동을 바로 만들어드려요.</p>

  <div class="card">
    <label>부위 선택 (중복 가능)</label>
    <div id="groupButtons" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
      <button type="button" class="group-btn" data-group="하체">하체</button><button type="button" class="group-btn" data-group="가슴">가슴</button><button type="button" class="group-btn" data-group="등">등</button><button type="button" class="group-btn" data-group="어깨">어깨</button><button type="button" class="group-btn" data-group="팔">팔</button><button type="button" class="group-btn" data-group="코어">코어</button><button type="button" class="group-btn" data-group="전신">전신</button>
    </div>

    <div class="grid-2">
      <div>
        <label for="genWeight">체중 (kg)</label>
        <input type="number" id="genWeight" inputmode="decimal" placeholder="예: 70">
      </div>
      <div>
        <label for="genLevel">난이도</label>
        <select id="genLevel">
          <option value="초급">초급</option>
          <option value="중급" selected>중급</option>
          <option value="고급">고급</option>
        </select>
      </div>
    </div>

    <label for="genCount">운동 개수</label>
    <select id="genCount">
      <option value="3">3개</option>
      <option value="4" selected>4개</option>
      <option value="5">5개</option>
    </select>

    <button class="btn" onclick="generateRoutine()">루틴 생성하기</button>
  </div>

  <div id="genResultWrap" style="display:none;">
    <div class="card" id="genResult"></div>
    <button class="btn secondary" onclick="generateRoutine(true)">다시 뽑기 (같은 조건)</button>
  </div>

  <script>
  const EXERCISE_POOL = [{"id": "pushup", "name": "푸시업", "category": "bodyweight", "muscle_group": "가슴", "sets": [3, 4], "reps": [10, 20], "unit": "회", "bw_mult": null}, {"id": "pullup", "name": "풀업", "category": "bodyweight", "muscle_group": "등", "sets": [3, 4], "reps": [5, 12], "unit": "회", "bw_mult": null}, {"id": "bodyweight-squat", "name": "맨몸 스쿼트", "category": "bodyweight", "muscle_group": "하체", "sets": [3, 4], "reps": [15, 25], "unit": "회", "bw_mult": null}, {"id": "plank", "name": "플랭크", "category": "bodyweight", "muscle_group": "코어", "sets": [3, 4], "reps": [30, 60], "unit": "초", "bw_mult": null}, {"id": "burpee", "name": "버피", "category": "bodyweight", "muscle_group": "전신", "sets": [3, 4], "reps": [10, 20], "unit": "회", "bw_mult": null}, {"id": "bench-press", "name": "벤치프레스", "category": "equipment", "muscle_group": "가슴", "sets": [3, 5], "reps": [6, 10], "unit": "회", "bw_mult": {"초급": 0.4, "중급": 0.65, "고급": 0.9}}, {"id": "squat", "name": "바벨 스쿼트", "category": "equipment", "muscle_group": "하체", "sets": [3, 5], "reps": [5, 8], "unit": "회", "bw_mult": {"초급": 0.6, "중급": 0.95, "고급": 1.35}}, {"id": "deadlift", "name": "데드리프트", "category": "equipment", "muscle_group": "하체", "sets": [3, 5], "reps": [4, 6], "unit": "회", "bw_mult": {"초급": 0.7, "중급": 1.05, "고급": 1.5}}, {"id": "overhead-press", "name": "오버헤드프레스", "category": "equipment", "muscle_group": "어깨", "sets": [3, 4], "reps": [6, 10], "unit": "회", "bw_mult": {"초급": 0.25, "중급": 0.4, "고급": 0.55}}, {"id": "lat-pulldown", "name": "랫풀다운", "category": "equipment", "muscle_group": "등", "sets": [3, 4], "reps": [8, 12], "unit": "회", "bw_mult": {"초급": 0.35, "중급": 0.55, "고급": 0.75}}, {"id": "leg-press", "name": "레그프레스", "category": "equipment", "muscle_group": "하체", "sets": [3, 4], "reps": [10, 15], "unit": "회", "bw_mult": {"초급": 0.8, "중급": 1.3, "고급": 1.8}}, {"id": "barbell-row", "name": "바벨로우", "category": "equipment", "muscle_group": "등", "sets": [3, 4], "reps": [8, 12], "unit": "회", "bw_mult": {"초급": 0.35, "중급": 0.55, "고급": 0.75}}, {"id": "dumbbell-curl", "name": "덤벨컬", "category": "equipment", "muscle_group": "팔", "sets": [3, 4], "reps": [10, 15], "unit": "회", "bw_mult": {"초급": 0.08, "중급": 0.12, "고급": 0.18}}, {"id": "lunge", "name": "런지", "category": "bodyweight", "muscle_group": "하체", "sets": [3, 4], "reps": [10, 16], "unit": "회", "bw_mult": null}, {"id": "mountain-climber", "name": "마운틴클라이머", "category": "bodyweight", "muscle_group": "코어", "sets": [3, 4], "reps": [20, 40], "unit": "회", "bw_mult": null}, {"id": "crunch", "name": "크런치", "category": "bodyweight", "muscle_group": "코어", "sets": [3, 4], "reps": [15, 25], "unit": "회", "bw_mult": null}];

  function pickRandom(arr, n) {
    const copy = [...arr];
    const picked = [];
    while (picked.length < n && copy.length > 0) {
      const idx = Math.floor(Math.random() * copy.length);
      picked.push(copy.splice(idx, 1)[0]);
    }
    return picked;
  }

  function randInRange([min, max]) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.group-btn').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });
  });

  function generateRoutine() {
    const selected = [...document.querySelectorAll('.group-btn.active')].map(b => b.dataset.group);
    const weight = parseFloat(document.getElementById('genWeight').value);
    const level = document.getElementById('genLevel').value;
    const count = parseInt(document.getElementById('genCount').value);

    if (selected.length === 0) { alert('부위를 최소 1개 이상 선택해주세요.'); return; }
    if (!weight) { alert('체중을 입력해주세요.'); return; }

    let candidates = EXERCISE_POOL.filter(e => selected.includes(e.muscle_group));
    if (candidates.length === 0) { alert('선택한 부위에 해당하는 운동이 아직 없어요.'); return; }

    const picked = pickRandom(candidates, Math.min(count, candidates.length));

    let html = '<h3 style="margin-top:0;">오늘의 루틴</h3>';
    picked.forEach(ex => {
      const sets = randInRange(ex.sets);
      const reps = randInRange(ex.reps);
      let weightLine = '';
      if (ex.bw_mult) {
        const mult = ex.bw_mult[level];
        let suggested = weight * mult;
        suggested = Math.round(suggested / 2.5) * 2.5;
        weightLine = `<div style="color:var(--accent-2); font-size:14px; margin-top:2px;">추천 중량 약 ${suggested}kg (체중 대비 추정치)</div>`;
      }
      html += `
        <div class="log-entry" style="display:block;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <a href="exercises/${ex.id}.html" style="font-weight:700; font-size:15px;">${ex.name}</a>
            <span style="font-size:12px; color:var(--text-dim);">${ex.muscle_group}</span>
          </div>
          <div style="color:var(--text-dim); font-size:14px; margin-top:4px;">${sets}세트 x ${reps}${ex.unit}</div>
          ${weightLine}
        </div>`;
    });

    document.getElementById('genResult').innerHTML = html;
    document.getElementById('genResultWrap').style.display = 'block';
  }
  </script>

  <style>
  .group-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .group-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  </style>

<div class="ad-slot">
  <ins class="adsbygoogle"
    style="display:block; width:100%;"
    data-ad-client="ca-pub-8486360926248718"
    data-ad-slot="0000000000"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
</div>
</div>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
<script src="js/common.js"></script>
<script>renderChrome('home', '');</script>
</body>
</html>
