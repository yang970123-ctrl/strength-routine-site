<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 기록 - 오늘의 근력루틴</title>
<meta name="description" content="세트, 중량, 반복수를 기록하고 나만의 PR 다이어리를 관리하세요.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8486360926248718" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <h1>운동 기록</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">기기 브라우저에 자동 저장됩니다</p>

  <div class="card">
    <label for="exercise">종목</label>
    <select id="exercise">
      <option>스쿼트</option>
      <option>벤치프레스</option>
      <option>데드리프트</option>
      <option>오버헤드프레스</option>
      <option>직접입력</option>
    </select>
    <div class="grid-2">
      <div>
        <label for="w">중량 (kg)</label>
        <input type="number" id="w" inputmode="decimal">
      </div>
      <div>
        <label for="r">반복수</label>
        <input type="number" id="r" inputmode="numeric">
      </div>
    </div>
    <button class="btn" onclick="handleAdd()">기록 추가</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">최근 기록</h3>
    <div id="logList"></div>
  </div>

  <div class="ad-slot">
    <ins class="adsbygoogle"
      style="display:block; width:100%;"
      data-ad-client="ca-pub-8486360926248718"
      data-ad-slot="0000000000"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>
  </div>
</div>

<script src="js/common.js"></script>
<script>
function renderList() {
  const logs = getLogs();
  const el = document.getElementById('logList');
  if (logs.length === 0) {
    el.innerHTML = '<p style="color:var(--text-dim); font-size:14px;">아직 기록이 없습니다.</p>';
    return;
  }
  el.innerHTML = logs.map(l => `
    <div class="log-entry">
      <div>
        <strong>${l.exercise}</strong> · ${l.weight}kg × ${l.reps}회
        <div style="font-size:12px; color:var(--text-dim);">${l.date}</div>
      </div>
      <span class="del" onclick="handleDelete(${l.id})">삭제</span>
    </div>
  `).join('');
}

function handleAdd() {
  const exercise = document.getElementById('exercise').value;
  const weight = parseFloat(document.getElementById('w').value);
  const reps = parseInt(document.getElementById('r').value);
  if (!weight || !reps) { alert('중량과 반복수를 입력해주세요.'); return; }
  addLog({ exercise, weight, reps });
  document.getElementById('w').value = '';
  document.getElementById('r').value = '';
  renderList();
}

function handleDelete(id) {
  deleteLog(id);
  renderList();
}

renderList();
</script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
<script>renderChrome('log');</script>
</body>
</html>
