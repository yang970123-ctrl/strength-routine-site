  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 디클라인 푸시업
  </p>
  <h1 style="margin-top:0;">디클라인 푸시업</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">발을 높은 곳에 올려 가슴 상부와 어깨에 더 강한 자극을 주는 푸시업 변형입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">가슴 상부, 어깨, 삼두</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>발을 의자 위에 올리고 양손은 바닥에 어깨너비로 짚는다.</li><li>몸을 일직선으로 유지하며 가슴을 바닥 가까이 내린다.</li><li>가슴과 어깨 힘으로 밀어 올린다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>일반 푸시업보다 난이도가 높으니 코어를 단단히 잡는다.</li><li>어깨나 허리가 처지지 않도록 주의한다.</li>
    </ul>
