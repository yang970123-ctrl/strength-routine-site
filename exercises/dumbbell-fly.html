  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../equipment.html">기구운동</a> &gt; 덤벨 플라이
  </p>
  <h1 style="margin-top:0;">덤벨 플라이</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">팔을 편 채로 덤벨을 벌렸다 모으며 가슴을 넓게 늘려주는 고립 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">가슴 (전체, 특히 바깥쪽)</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>벤치에 누워 덤벨을 가슴 위로 들어올린다.</li><li>팔꿈치를 살짝 굽힌 채 양옆으로 크게 벌린다.</li><li>가슴의 힘으로 다시 처음 위치로 모은다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>팔꿈치를 너무 곧게 펴면 팔꿈치 관절에 부담이 갈 수 있다.</li><li>무거운 중량보다 가동범위와 수축감에 집중한다.</li>
    </ul>
  </div>
