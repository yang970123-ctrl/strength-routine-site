<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="bodyweight.html">맨몸운동</a> &gt; 푸시업
  </p>
  <h1 style="margin-top:0;">푸시업</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">장비 없이 가슴과 삼두를 자극하는 대표적인 맨몸운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">가슴, 삼두, 어깨</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>손을 어깨너비보다 약간 넓게 벌리고 플랭크 자세를 잡는다.</li><li>몸을 일직선으로 유지한 채 팔꿈치를 굽혀 가슴이 바닥에 가까워질 때까지 내려간다.</li><li>가슴과 삼두의 힘으로 밀어 올려 시작 자세로 돌아온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>허리가 꺾이지 않도록 복부에 힘을 유지한다.</li><li>팔꿈치는 몸통에서 약 45도 각도를 유지한다.</li>
    </ul>
  </div>
