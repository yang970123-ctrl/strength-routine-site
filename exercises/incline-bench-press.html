<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../equipment.html">기구운동</a> &gt; 인클라인 벤치프레스
  </p>
  <h1 style="margin-top:0;">인클라인 벤치프레스</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">벤치를 비스듬히 세워 가슴 상부를 집중적으로 발달시키는 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">가슴 상부, 어깨, 삼두</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>벤치를 30~45도로 세우고 눕는다.</li><li>바를 가슴 상부 위로 내렸다가 밀어 올린다.</li><li>팔이 완전히 펴지기 직전까지 반복한다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>각도가 너무 높으면 어깨 위주로 자극이 쏠리니 30~45도를 권장한다.</li><li>견갑골을 모은 상태를 끝까지 유지한다.</li>
    </ul>
  </div>
