  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 인버티드 로우
  </p>
  <h1 style="margin-top:0;">인버티드 로우</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">낮은 봉이나 테이블 아래에서 몸을 당겨 올리는, 풀업이 아직 어려운 사람에게 좋은 등 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">광배근, 승모근, 이두</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>낮게 고정된 봉을 잡고 몸을 일직선으로 뻗어 눕듯이 매달린다.</li><li>가슴을 봉 쪽으로 당겨 올린다.</li><li>천천히 팔을 펴며 시작 자세로 돌아온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>발 위치를 몸 쪽으로 가져오면 쉬워지고, 멀리 뻗으면 어려워진다.</li><li>몸이 아래로 처지지 않도록 코어에 힘을 유지한다.</li>
    </ul>
  </div>
