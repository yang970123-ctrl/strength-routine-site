<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 슈퍼맨
  </p>
  <h1 style="margin-top:0;">슈퍼맨</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">엎드린 자세에서 팔다리를 동시에 들어 등 하부를 강화하는 기본 홈트 동작입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">등, 척추기립근, 둔근</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>바닥에 엎드려 팔을 앞으로, 다리를 뒤로 뻗는다.</li><li>팔과 다리, 상체를 동시에 바닥에서 들어올린다.</li><li>잠시 유지한 뒤 천천히 내려온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>목을 과도하게 젖히지 않고 시선은 바닥을 향한다.</li><li>허리 통증이 있다면 팔과 다리를 번갈아 드는 방식으로 시작한다.</li>
    </ul>
  </div>
