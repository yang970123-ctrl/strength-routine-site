  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 딥스
  </p>
  <h1 style="margin-top:0;">딥스</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">평행봉이나 벤치에서 체중을 이용해 삼두와 가슴 하부를 강하게 자극하는 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">삼두, 가슴 하부, 어깨</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>평행봉을 잡고 팔을 펴서 몸을 지탱한다.</li><li>팔꿈치를 굽혀 상체를 아래로 내린다.</li><li>삼두와 가슴 힘으로 밀어 올려 시작 자세로 돌아온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>어깨에 통증이 있다면 내려가는 깊이를 줄인다.</li><li>상체를 살짝 앞으로 숙이면 가슴에 더 자극이 간다.</li>
    </ul>
  </div>
