<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="equipment.html">기구운동</a> &gt; 레그프레스
  </p>
  <h1 style="margin-top:0;">레그프레스</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">머신에 앉아 안전하게 하체 전체를 강화할 수 있는 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">대퇴사두, 둔근, 햄스트링</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>시트에 앉아 발판에 발을 어깨너비로 올린다.</li><li>무릎을 굽혀 발판을 몸쪽으로 당겨온다.</li><li>발바닥 전체로 밀어내며 다리를 편다 (무릎은 완전히 펴지 않는다).</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>무릎이 안쪽으로 모이지 않도록 주의한다.</li><li>허리가 시트에서 뜨지 않는 범위까지만 내린다.</li>
    </ul>
  </div>
