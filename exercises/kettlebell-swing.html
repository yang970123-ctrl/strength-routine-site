  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../equipment.html">기구운동</a> &gt; 케틀벨 스윙
  </p>
  <h1 style="margin-top:0;">케틀벨 스윙</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">케틀벨을 이용해 힙 힌지 동작으로 전신 파워와 심폐지구력을 함께 키우는 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">둔근, 햄스트링, 코어, 심폐지구력</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>케틀벨을 양손으로 잡고 다리 사이에서 스윙을 시작한다.</li><li>엉덩이를 뒤로 빼며 케틀벨을 뒤로 보낸 뒤, 엉덩이를 강하게 펴며 앞으로 스윙한다.</li><li>케틀벨이 가슴 높이까지 올라가도록 반복한다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>팔의 힘이 아닌 엉덩이(힙 힌지) 힘으로 스윙한다.</li><li>허리가 과도하게 굽지 않도록 코어에 힘을 유지한다.</li>
    </ul>
  </div>
