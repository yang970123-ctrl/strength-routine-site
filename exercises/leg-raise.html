  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 레그레이즈
  </p>
  <h1 style="margin-top:0;">레그레이즈</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">누운 자세에서 다리를 들어올려 하복부를 집중적으로 자극하는 코어 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">하복부</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">중급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>바닥에 누워 다리를 편 채로 모은다.</li><li>복부 힘으로 다리를 90도까지 들어올린다.</li><li>천천히 내리되 바닥에 완전히 닿기 전에 멈췄다가 반복한다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>허리가 바닥에서 뜨지 않도록 하복부에 힘을 유지한다.</li><li>무릎을 살짝 굽히면 난이도를 낮출 수 있다.</li>
    </ul>
  </div>
