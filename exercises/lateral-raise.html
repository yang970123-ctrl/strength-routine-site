    <a href="../equipment.html">기구운동</a> &gt; 사이드 레터럴 레이즈
  </p>
  <h1 style="margin-top:0;">사이드 레터럴 레이즈</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">덤벨을 옆으로 들어올려 어깨 측면(둥근 어깨 라인)을 발달시키는 고립 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">어깨 (측면삼각근)</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>덤벨을 양손에 들고 팔을 자연스럽게 내린다.</li><li>팔꿈치를 살짝 굽힌 채 옆으로 어깨 높이까지 들어올린다.</li><li>천천히 시작 자세로 내린다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>반동 없이 어깨 힘으로만 천천히 들어올린다.</li><li>너무 무거운 중량보다 정확한 자세와 각도를 우선한다.</li>
    </ul>
  </div>
