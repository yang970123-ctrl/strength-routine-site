  <h1 style="margin-top:0;">데드리프트</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">바닥의 바벨을 들어올려 후면 사슬 전체를 강화하는 3대 운동 중 하나입니다.</p>

    </ul>
