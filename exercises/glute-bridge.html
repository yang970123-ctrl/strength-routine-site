<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 힙 브릿지
  </p>
  <h1 style="margin-top:0;">힙 브릿지</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">누운 자세에서 엉덩이를 들어올려 둔근을 활성화하는 대표적인 홈트 하체 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">둔근, 햄스트링, 코어</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>바닥에 누워 무릎을 세우고 발을 골반너비로 둔다.</li><li>둔근에 힘을 주며 엉덩이를 천장 방향으로 들어올린다.</li><li>상단에서 잠시 멈췄다가 천천히 내려온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>허리로 밀어올리지 않고 둔근 수축에 집중한다.</li><li>상단에서 1~2초 정지하면 자극이 더 커진다.</li>
    </ul>
  </div>
