<div class="container">

  <p style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">
    <a href="../bodyweight.html">맨몸운동</a> &gt; 스텝업
  </p>
  <h1 style="margin-top:0;">스텝업</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">계단이나 의자에 오르내리며 하체를 단련하는 실용적인 홈트 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">대퇴사두, 둔근</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>계단이나 튼튼한 의자 앞에 선다.</li><li>한쪽 발을 올리고 그 다리의 힘으로 몸을 들어올린다.</li><li>반대쪽 발도 올려 완전히 선 뒤, 내려와 반복한다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>무릎이 발끝보다 안쪽으로 쏠리지 않게 한다.</li><li>반동 없이 다리 힘만으로 오르도록 한다.</li>
    </ul>
  </div>
