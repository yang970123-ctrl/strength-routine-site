  <h1 style="margin-top:0;">어시스트 풀업머신</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">맨몸 턱걸이가 아직 어려운 사람을 위해 보조 중량으로 풀업 동작을 연습하는 머신입니다.</p>
