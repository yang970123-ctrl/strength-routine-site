    <a href="../bodyweight.html">맨몸운동</a> &gt; 백 익스텐션
  </p>
  <h1 style="margin-top:0;">백 익스텐션</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">허리와 등 하부의 지구력을 강화하는 운동으로, 데드리프트 보조 운동으로도 좋습니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">척추기립근, 둔근, 햄스트링</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>백 익스텐션 벤치(또는 바닥)에 엎드려 상체를 아래로 늘어뜨린다.</li><li>허리와 둔근의 힘으로 상체를 들어올려 일직선을 만든다.</li><li>천천히 시작 자세로 내려온다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>허리를 과도하게 꺾을 정도로 들어올리지 않는다.</li><li>둔근에 힘을 주는 느낌으로 수행하면 허리 부담이 줄어든다.</li>
    </ul>
