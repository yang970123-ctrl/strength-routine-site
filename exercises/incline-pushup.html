  <h1 style="margin-top:0;">인클라인 푸시업</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">손을 의자나 벤치 등 높은 곳에 짚어 난이도를 낮춘 입문용 푸시업입니다.</p>
