  </p>
  <h1 style="margin-top:0;">데드버그</h1>
  <p style="color:var(--text-dim); margin-top:-8px; font-size:14px;">허리에 무리 없이 코어 안정성을 기르는 데 효과적인 전신성 코어 운동입니다.</p>

  <div class="card">
    <div class="grid-2">
      <div>
        <label>타겟 부위</label>
        <p style="margin-top:-4px;">코어 전체, 척추 안정성</p>
      </div>
      <div>
        <label>난이도</label>
        <p style="margin-top:-4px;">초급</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">동작 방법</h3>
    <ol style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>바닥에 누워 팔은 천장으로, 무릎은 90도로 들어올린다.</li><li>허리를 바닥에 붙인 채 한쪽 팔과 반대쪽 다리를 동시에 뻗는다.</li><li>천천히 시작 자세로 돌아온 뒤 반대쪽도 반복한다.</li>
    </ol>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">주의사항 & 팁</h3>
    <ul style="color:var(--text-dim); font-size:14px; line-height:1.8; padding-left:20px;">
      <li>허리가 바닥에서 뜨지 않는 범위까지만 팔다리를 뻗는다.</li><li>천천히, 호흡과 함께 진행하면 효과가 더 좋다.</li>
    </ul>
